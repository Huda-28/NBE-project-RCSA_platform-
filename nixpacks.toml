# Nixpacks configuration for Coolify deployment
[phases.setup]
nixPkgs = ["nodejs_20", "python312", "gcc", "gnumake"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r requirements-export.txt -r requirements-document-extraction.txt",
  "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="100%" height="100%">
  <!-- NBE Official Brand Logo (White Monochrome version for dark headers and sidebars) -->
  <g fill="#FFFFFF">
    <!-- NBE Emblem (Right side in RTL, Left in LTR layout) -->
    <g transform="translate(490, 10)">
      <!-- Outer arched frame -->
      <path d="M 15 15 C 15 8, 20 2, 28 2 L 82 2 C 90 2, 95 8, 95 15 L 95 110 C 95 118, 90 124, 82 124 L 28 124 C 20 124, 15 118, 15 110 Z M 27 14 L 27 112 C 27 114, 29 116, 31 116 L 79 116 C 81 116, 83 114, 83 112 L 83 14 C 83 12, 81 10, 79 10 L 31 10 C 29 10, 27 12, 27 14 Z" />
      <!-- Semi-circle arch element -->
      <path d="M 33 35 C 33 48, 43 65, 55 65 C 67 65, 77 48, 77 35 Z" />
      <!-- Lower three vertical pillar bars -->
      <rect x="34" y="80" width="8" height="42" rx="4" />
      <rect x="51" y="80" width="8" height="42" rx="4" />
      <rect x="68" y="80" width="8" height="42" rx="4" />
    </g>

    <!-- Arabic Calligraphy "البنك الأهلي المصري" -->
    <text x="470" y="62" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-weight="800" font-size="42" text-anchor="end" letter-spacing="0.5">البنك الأهلي المصري</text>
    
    <!-- English Corporate Subtitle "NATIONAL BANK OF EGYPT" -->
    <text x="470" y="105" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" text-anchor="end" letter-spacing="2">NATIONAL BANK OF EGYPT</text>
    
    <!-- Separation accent line -->
    <line x1="30" y1="78" x2="470" y2="78" stroke="#F79C1E" stroke-width="2.5" opacity="0.9" />
  </g>
</svg>
